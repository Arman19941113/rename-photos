name: Publish desktop release
run-name: Publish desktop release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: ${{ github.event.created }}
    runs-on: ubuntu-latest
    outputs:
      release-notes: ${{ steps.release-notes.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Check release tag matches app version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="${GITHUB_REF_NAME}"

          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error title=Release version mismatch::Tag ${TAG} does not match app version v${VERSION}."
            exit 1
          fi

          echo "Publishing existing release tag ${TAG}."

      - name: Validate and extract release notes
        id: release-notes
        run: node scripts/extract-release-notes.mjs --version "$GITHUB_REF_NAME" --github-output-name body

  test-release:
    needs: validate-release
    uses: ./.github/workflows/test.yml

  prepare-draft-release:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_NOTES: ${{ needs.validate-release.outputs.release-notes }}
        with:
          script: |
            const { prepareDraftRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`)
            const release = await prepareDraftRelease({
              github,
              repo: context.repo,
              tag: context.ref.slice('refs/tags/'.length),
              commit: context.sha,
              body: process.env.RELEASE_NOTES,
            })
            core.setOutput('release-id', release.id)

  build-release-assets:
    needs: prepare-draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles dmg'
            bundle-path: 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles dmg'
            bundle-path: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg'
          # Pin the Linux compatibility baseline; keep Rust CI on the same image.
          - platform: 'ubuntu-24.04'
            args: '--bundles deb'
            bundle-path: 'src-tauri/target/release/bundle/deb'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            bundle-path: 'src-tauri/target/release/bundle/nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release installer
        shell: bash
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm tauri build ${{ matrix.args }}

      # tauri-action also archives and uploads the macOS .app, even with --bundles dmg.
      - name: Upload release installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ matrix.bundle-path }}
        run: |
          shopt -s nullglob
          installers=("$BUNDLE_PATH"/*.{dmg,exe,deb})
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one installer in $BUNDLE_PATH, found ${#installers[@]}."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${installers[0]}" --clobber

  publish-release:
    needs: [test-release, prepare-draft-release, build-release-assets]
    runs-on: ubuntu-latest
    environment: 'production'
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish completed release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare-draft-release.outputs.release-id }}
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`)
            await publishRelease({
              github,
              repo: context.repo,
              tag: context.ref.slice('refs/tags/'.length),
              releaseId: process.env.RELEASE_ID,
            })
