[package]
name = "rename-photos"
version = "0.0.0"
description = "A cross-platform desktop-app for renaming photos using EXIF data"
authors = ["Arman Tang"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
nom-exif = "3.8.0"
chrono = "0.4.45"
anyhow = "1.0.104"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.7.0"

[dev-dependencies]
tempfile = "3.27.0"
